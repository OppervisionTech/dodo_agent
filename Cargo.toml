[workspace]
resolver = "2"
members = [
    "crates/agent-core",
    "crates/agent-collectors",
    "crates/agent-transport",
    "crates/agent-config",
    "crates/agent-ebpf",
    "crates/agent-platform",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
license = "Proprietary"
authors = ["Oppervision <eng@oppervision.com>"]
repository = "https://github.com/oppervision/dodo_agent"

[workspace.dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }

# gRPC / Protobuf
tonic = { version = "0.12", features = ["tls", "tls-roots"] }
prost = "0.13"
prost-types = "0.13"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"

# Error handling
thiserror = "2"
anyhow = "1"

# Logging / Tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Compression
zstd = "0.13"
lz4_flex = "0.11"

# Crypto
sha2 = "0.10"

# UUID
uuid = { version = "1", features = ["v4"] }

# Regex
regex = "1"

# Testing (dev)
proptest = "1"

# HTTP (for cloud metadata, OTEL HTTP)
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
axum = "0.7"

# Database clients (feature-gated in agent-collectors)
tokio-postgres = "0.7"
mongodb = "2"

# TLS
rustls = "0.23"
rustls-pemfile = "2"
tokio-rustls = "0.26"

# X.509
x509-parser = "0.16"

# Internal crates
agent-core = { path = "crates/agent-core" }
agent-collectors = { path = "crates/agent-collectors" }
agent-transport = { path = "crates/agent-transport" }
agent-config = { path = "crates/agent-config" }
agent-ebpf = { path = "crates/agent-ebpf" }
agent-platform = { path = "crates/agent-platform" }

# The root package is the binary
[package]
name = "aegis-agent"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[features]
default = ["linux"]
# Collector features (binary-level, propagated to agent-collectors)
otel = ["agent-collectors/otel"]
docker = ["agent-collectors/docker"]
postgres = ["agent-collectors/postgres"]
mongodb = ["agent-collectors/mongodb"]
redis-collector = ["agent-collectors/redis-collector"]

linux = [
    "agent-platform/linux",
    "agent-ebpf/enabled",
    "agent-collectors/ebpf",
    "otel",
    "docker",
    "postgres",
    "mongodb",
    "redis-collector",
    "dep:agent-ebpf",
]
windows = [
    "agent-platform/windows",
    "otel",
    "docker",
    "postgres",
    "mongodb",
    "redis-collector",
]
lite = [
    "agent-platform/lite",
    "docker",
    "redis-collector",
]

[dependencies]
agent-core = { workspace = true }
agent-collectors = { workspace = true }
agent-transport = { workspace = true }
agent-config = { workspace = true }
agent-ebpf = { workspace = true, optional = true }
agent-platform = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow = { workspace = true }
uuid = { workspace = true }
serde_json = { workspace = true }

[[bin]]
name = "aegis-agent"
path = "src/main.rs"
