name: Agent CI

on:
  push:
    branches: [main, develop, staging]
  pull_request:
    branches: [main, develop, staging]

permissions:
  contents: read

concurrency:
  group: agent-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_BUILD_JOBS: 2
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  fmt:
    name: Format Check
    runs-on: ${{ fromJSON(vars.CI_RUNNER_LABELS || '["ubuntu-latest"]') }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Installer and release archive contracts
        run: |
          bash tests/test-installer.sh
          python3 tests/test-release-contract.py
          python3 tests/test-staging-bundle.py
          python3 tests/test-coverage-contract.py

  clippy:
    name: Clippy Lint
    runs-on: ${{ fromJSON(vars.CI_RUNNER_LABELS || '["ubuntu-latest"]') }}
    strategy:
      matrix:
        feature: [linux, windows, lite]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: |
          if [ "${{ matrix.feature }}" = "linux" ]; then
            cargo clippy --features linux -- -D warnings
          else
            cargo clippy --no-default-features --features ${{ matrix.feature }} -- -D warnings
          fi

  test:
    name: Tests
    runs-on: ${{ fromJSON(vars.CI_RUNNER_LABELS || '["ubuntu-latest"]') }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --features linux --all

  coverage:
    name: Code Coverage
    runs-on: ${{ fromJSON(vars.CI_RUNNER_LABELS || '["ubuntu-latest"]') }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: coverage

      - name: Install cargo-tarpaulin
        run: cargo install cargo-tarpaulin --locked

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run coverage
        run: |
          set -euo pipefail
          mkdir -p coverage
          cargo tarpaulin \
            --features linux \
            --workspace \
            --out Html Lcov Json Stdout \
            --fail-under 80 \
            --output-dir coverage/ \
            --timeout 120 \
            --exclude-files "*/target/*" "*/tests/*" | tee coverage/tarpaulin.log

      - name: Check coverage threshold
        run: python3 scripts/check-coverage.py coverage/tarpaulin.log

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 14

      - name: Upload lcov to Coveralls
        if: github.event_name == 'push'
        uses: coverallsapp/github-action@v2
        with:
          file: coverage/lcov.info
          fail-on-error: false

  build:
    name: Build Variants
    runs-on: ${{ fromJSON(vars.CI_RUNNER_LABELS || '["ubuntu-latest"]') }}
    strategy:
      matrix:
        include:
          - feature: linux
            binary: aegis-agent
          - feature: windows
            binary: aegis-agent
          - feature: lite
            binary: aegis-agent
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: |
          if [ "${{ matrix.feature }}" = "linux" ]; then
            cargo build --features linux
          else
            cargo build --no-default-features --features ${{ matrix.feature }}
          fi
      - name: Verify binary name
        run: test -f target/debug/${{ matrix.binary }}

  security:
    name: Security Audit
    runs-on: ${{ fromJSON(vars.CI_RUNNER_LABELS || '["ubuntu-latest"]') }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo install cargo-audit
      - run: cargo audit
