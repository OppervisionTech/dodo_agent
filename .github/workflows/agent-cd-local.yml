name: Agent CD (local)

on:
  push:
    branches: [main, develop]
  workflow_dispatch:
    inputs:
      environment:
        description: "Ambiente alvo"
        type: choice
        options: [staging, prod]
        default: staging

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: oppervisiontech/aegis-agent

jobs:
  build-push:
    name: Build & Push Image
    runs-on: [self-hosted, local]
    environment: ${{ github.event.inputs.environment || 'staging' }}
    outputs:
      image-tag: ${{ steps.meta.outputs.version }}
      image-digest: ${{ steps.build.outputs.digest }}

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine target registries
        id: registries
        run: |
          enabled="${{ secrets.DOCKERHUB_USERNAME != '' && secrets.DOCKERHUB_TOKEN != '' }}"
          echo "dockerhub_enabled=$enabled" >> "$GITHUB_OUTPUT"
          images="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"
          if [ "$enabled" = "true" ]; then
            images="${images}
          docker.io/enzotrevisan9/dodo-agent"
          fi
          {
            echo "images<<REGISTRIES_EOF"
            echo "$images"
            echo "REGISTRIES_EOF"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v3
        if: steps.registries.outputs.dockerhub_enabled == 'true'
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ steps.registries.outputs.images }}
          tags: |
            type=raw,value=${{ github.event.inputs.environment || 'staging' }}
            type=sha,prefix=sha-
            type=raw,value=latest,enable=${{ (github.event.inputs.environment || 'staging') == 'prod' }}

      - uses: docker/build-push-action@v5
        id: build
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VARIANT=linux

  coverage-staging:
    name: Coverage Report (Staging)
    runs-on: [self-hosted, local]
    if: (github.event.inputs.environment || 'staging') == 'staging'
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: coverage-cd

      - name: Install cargo-tarpaulin
        run: cargo install cargo-tarpaulin --locked

      - name: Run coverage
        run: |
          cargo tarpaulin \
            --features linux \
            --workspace \
            --out Html Lcov Json \
            --output-dir coverage/ \
            --timeout 120 \
            --exclude-files "*/target/*" "*/tests/*"

      - name: Coverage summary
        run: |
          COVERAGE=$(cargo tarpaulin --features linux --workspace --out Stdout 2>/dev/null \
            | grep -oP '[\d.]+(?= % coverage)' | tail -1 || echo "0")
          {
            echo "## Coverage Report — Staging Deploy"
            echo "| Metric | Value |"
            echo "| --- | --- |"
            echo "| Line Coverage | ${COVERAGE}% |"
            echo "| Commit | \`${{ github.sha }}\` |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-staging-${{ github.sha }}
          path: coverage/
          retention-days: 30
