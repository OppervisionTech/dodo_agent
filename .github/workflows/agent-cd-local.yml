name: Agent CD (local)

on:
  push:
    branches: [main, develop, staging]
  workflow_dispatch:
    inputs:
      environment:
        description: "Ambiente alvo"
        type: choice
        options: [staging, prod]
        default: staging

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: oppervisiontech/aegis-agent

jobs:
  build-push:
    name: Build & Push Image
    runs-on: ${{ fromJSON(vars.CD_RUNNER_LABELS || '["ubuntu-latest"]') }}
    environment: ${{ github.event.inputs.environment || 'staging' }}
    outputs:
      image-tag: ${{ steps.meta.outputs.version }}
      image-digest: ${{ steps.build.outputs.digest }}

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine target registries
        id: registries
        run: |
          enabled="${{ secrets.DOCKERHUB_USERNAME != '' && secrets.DOCKERHUB_TOKEN != '' }}"
          echo "dockerhub_enabled=$enabled" >> "$GITHUB_OUTPUT"
          images="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"
          if [ "$enabled" = "true" ]; then
            images="${images}
          docker.io/enzotrevisan9/dodo-agent"
          fi
          {
            echo "images<<REGISTRIES_EOF"
            echo "$images"
            echo "REGISTRIES_EOF"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v3
        if: steps.registries.outputs.dockerhub_enabled == 'true'
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ steps.registries.outputs.images }}
          tags: |
            type=raw,value=${{ github.event.inputs.environment || 'staging' }}
            type=sha,prefix=sha-
            type=raw,value=latest,enable=${{ (github.event.inputs.environment || 'staging') == 'prod' }}

      - uses: docker/build-push-action@v5
        id: build
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VARIANT=linux

  coverage-staging:
    name: Coverage Report (Staging)
    runs-on: ${{ fromJSON(vars.CD_RUNNER_LABELS || '["ubuntu-latest"]') }}
    if: (github.event.inputs.environment || 'staging') == 'staging'
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - uses: Swatinem/rust-cache@v2
        with:
          key: coverage-cd

      - name: Install cargo-tarpaulin
        run: cargo install cargo-tarpaulin --version 0.37.5 --locked

      - uses: astral-sh/setup-uv@v5
        with:
          version: '0.13.6'
          python-version: '3.12'
      - name: Prepare portable Python
        run: |
          python_env="${RUNNER_TEMP}/dodo-agent-python-${GITHUB_JOB}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          uv venv "$python_env" --python 3.12
          echo "$python_env/bin" >> "$GITHUB_PATH"

      - name: Run coverage
        run: |
          set -euo pipefail
          mkdir -p coverage
          cargo tarpaulin \
            --engine llvm \
            --features linux \
            --workspace \
            --follow-exec \
            --out Html Lcov Json Stdout \
            --output-dir coverage/ \
            --timeout 120 \
            --exclude-files "*/target/*" "*/tests/*" | tee coverage/tarpaulin.log

      - name: Coverage summary
        run: |
          COVERAGE=$(python3 scripts/check-coverage.py --print-percentage coverage/tarpaulin.log)
          {
            echo "## Coverage Report — Staging Deploy"
            echo "| Metric | Value |"
            echo "| --- | --- |"
            echo "| Line Coverage | ${COVERAGE}% |"
            echo "| Commit | \`${{ github.sha }}\` |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-staging-${{ github.sha }}
          path: coverage/
          retention-days: 30

  staging-bundle:
    name: Prepare immutable staging bundle
    if: github.ref == 'refs/heads/staging' && (github.event.inputs.environment || 'staging') == 'staging'
    needs: build-push
    runs-on: ${{ fromJSON(vars.CD_RUNNER_LABELS || '["ubuntu-latest"]') }}
    environment: staging
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: astral-sh/setup-uv@v5
        with:
          version: '0.13.6'
          python-version: '3.12'
      - name: Prepare portable Python
        run: |
          python_env="${RUNNER_TEMP}/dodo-agent-python-${GITHUB_JOB}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          uv venv "$python_env" --python 3.12
          echo "$python_env/bin" >> "$GITHUB_PATH"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract binary from the exact staging image
        env:
          IMAGE: ghcr.io/oppervisiontech/aegis-agent@${{ needs.build-push.outputs.image-digest }}
        run: |
          set -euo pipefail
          docker pull "$IMAGE"
          container_id="$(docker create "$IMAGE")"
          trap 'docker rm -f "$container_id" >/dev/null' EXIT
          docker cp "$container_id:/usr/local/bin/aegis-agent" "$RUNNER_TEMP/aegis-agent"
          revision="$(docker image inspect "$IMAGE" --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')"
          python3 scripts/build-staging-bundle.py \
            --binary "$RUNNER_TEMP/aegis-agent" --source-sha "$GITHUB_SHA" \
            --image "$IMAGE" --image-revision "$revision" --run-id "$GITHUB_RUN_ID" \
            --output "dist/staging-bundle-$GITHUB_SHA-$GITHUB_RUN_ID"
      - uses: actions/upload-artifact@v4
        with:
          name: agent-staging-${{ github.sha }}-${{ github.run_id }}
          path: dist/staging-bundle-${{ github.sha }}-${{ github.run_id }}/
          if-no-files-found: error
          retention-days: 30
      - name: Record distribution readiness
        run: |
          echo 'Staging bundle built from the pinned image; no tag, release or production registry published by this job.' >> "$GITHUB_STEP_SUMMARY"
          echo 'manifestReady=false: approve and test a customer-accessible download channel before configuring the portal.' >> "$GITHUB_STEP_SUMMARY"
