name: Agent CD

on:
  push:
    branches: [main, develop]
  workflow_dispatch:
    inputs:
      environment:
        description: "Ambiente alvo"
        type: choice
        options: [staging, prod]
        default: staging

permissions:
  contents: read
  packages: write
  id-token: write
  pull-requests: write
  issues: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: oppervisiontech/aegis-agent

jobs:
  build-push:
    name: Build & Push Image
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment || 'staging' }}
    outputs:
      image-tag: ${{ steps.meta.outputs.version }}
      image-digest: ${{ steps.build.outputs.digest }}

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ github.event.inputs.environment || 'staging' }}
            type=sha,prefix=sha-
            type=raw,value=latest,enable=${{ (github.event.inputs.environment || 'staging') == 'prod' }}

      - uses: docker/build-push-action@v5
        id: build
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VARIANT=linux

  coverage-staging:
    name: Coverage Report (Staging)
    runs-on: ubuntu-latest
    if: (github.event.inputs.environment || 'staging') == 'staging'
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: coverage-cd

      - name: Install cargo-tarpaulin
        run: cargo install cargo-tarpaulin --locked

      - name: Run coverage
        run: |
          cargo tarpaulin \
            --features linux \
            --workspace \
            --out Html Lcov Json \
            --output-dir coverage/ \
            --timeout 120 \
            --exclude-files "*/target/*" "*/tests/*"

      - name: Coverage summary
        run: |
          COVERAGE=$(cargo tarpaulin --features linux --workspace --out Stdout 2>/dev/null \
            | grep -oP '[\d.]+(?= % coverage)' | tail -1 || echo "0")
          {
            echo "## Coverage Report — Staging Deploy"
            echo "| Metric | Value |"
            echo "| --- | --- |"
            echo "| Line Coverage | ${COVERAGE}% |"
            echo "| Commit | \`${{ github.sha }}\` |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-staging-${{ github.sha }}
          path: coverage/
          retention-days: 30

  deploy:
    name: Deploy → ${{ github.event.inputs.environment || 'staging' }}
    runs-on: ubuntu-latest
    needs: [build-push]
    environment: ${{ github.event.inputs.environment || 'staging' }}

    env:
      ENVIRONMENT: ${{ github.event.inputs.environment || 'staging' }}

    steps:
      - uses: actions/checkout@v4
        with:
          repository: OppervisionTech/dodo_helm_charts
          token: ${{ secrets.GH_PAT }}
          path: helm-charts

      - name: Setup Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.14.0

      - name: Install doctl
        uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DO_TOKEN }}

      - name: Get kubeconfig
        run: |
          doctl kubernetes cluster kubeconfig save ${{ vars.DOKS_CLUSTER_NAME }} \
            --expiry-seconds 3600

      - name: Helm dependency build
        working-directory: helm-charts
        run: helm dependency build charts/aegis-agent

      - name: Helm dry-run
        working-directory: helm-charts
        run: |
          helm upgrade --install aegis-agent charts/aegis-agent \
            -f charts/aegis-agent/values.yaml \
            -f charts/aegis-agent/values-${{ env.ENVIRONMENT }}.yaml \
            --set image.repository=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }} \
            --set image.tag=sha-$(echo "${{ github.sha }}" | cut -c1-7) \
            --set gitSha=${{ github.sha }} \
            -n dodo \
            --create-namespace \
            --dry-run=client

      - name: Wait for Approval
        if: env.ENVIRONMENT == 'prod'
        uses: trstringer/manual-approval@v1
        with:
          secret: ${{ secrets.GITHUB_TOKEN }}
          minimum-approvals: 1
          approvers: leonanviana

      - name: Helm deploy
        working-directory: helm-charts
        run: |
          helm upgrade --install aegis-agent charts/aegis-agent \
            -f charts/aegis-agent/values.yaml \
            -f charts/aegis-agent/values-${{ env.ENVIRONMENT }}.yaml \
            --set image.repository=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }} \
            --set image.tag=sha-$(echo "${{ github.sha }}" | cut -c1-7) \
            --set gitSha=${{ github.sha }} \
            -n dodo \
            --create-namespace \
            --atomic \
            --timeout 10m \
            --wait

      - name: Helm status
        run: helm list -n dodo
