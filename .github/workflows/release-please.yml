name: Release Please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        # The "rust" strategy edits [package].version, which here is
        # `version.workspace = true` ("value at path package.version is not
        # tagged"). Manifest config bumps [workspace.package] and get.sh;
        # Cargo.lock is not touched: run `cargo update -w` on the release PR.
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          token: ${{ secrets.GH_PAT }}
