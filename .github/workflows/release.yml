name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

env:
  CARGO_TERM_COLOR: always
  REGISTRY: ghcr.io
  IMAGE_NAME: oppervisiontech/aegis-agent

jobs:
  build-binaries:
    name: Build ${{ matrix.variant }}-${{ matrix.arch }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - variant: linux
            arch: amd64
            target: x86_64-unknown-linux-musl
            binary: aegis-agent
            pkg: tar
          - variant: linux
            arch: arm64
            target: aarch64-unknown-linux-musl
            binary: aegis-agent
            pkg: tar
          - variant: lite
            arch: amd64
            target: x86_64-unknown-linux-musl
            binary: aegis-agent-lite
            pkg: tar
          - variant: lite
            arch: arm64
            target: aarch64-unknown-linux-musl
            binary: aegis-agent-lite
            pkg: tar
          - variant: windows
            arch: amd64
            target: x86_64-pc-windows-gnu
            binary: aegis-agent.exe
            pkg: zip
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.variant }}-${{ matrix.arch }}

      - name: Install build dependencies (Linux musl amd64)
        if: matrix.pkg == 'tar' && matrix.arch == 'amd64'
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Install build dependencies (Windows cross)
        if: matrix.pkg == 'zip'
        run: sudo apt-get update && sudo apt-get install -y gcc-mingw-w64-x86-64 zip

      - name: Install cross (arm64)
        if: matrix.arch == 'arm64'
        run: cargo install cross --locked

      - name: Build (native amd64)
        if: matrix.arch == 'amd64'
        run: cargo build --release --features ${{ matrix.variant }} --target ${{ matrix.target }}

      - name: Build (cross arm64)
        if: matrix.arch == 'arm64'
        run: cross build --release --features ${{ matrix.variant }} --target ${{ matrix.target }}

      - name: Package binary (tar)
        if: matrix.pkg == 'tar'
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/${{ matrix.binary }} dist/${{ matrix.binary }}
          cd dist
          sha256sum ${{ matrix.binary }} > ${{ matrix.binary }}.sha256
          tar -czf aegis-agent-${{ matrix.variant }}-${{ matrix.arch }}.tar.gz ${{ matrix.binary }}
          sha256sum aegis-agent-${{ matrix.variant }}-${{ matrix.arch }}.tar.gz > aegis-agent-${{ matrix.variant }}-${{ matrix.arch }}.tar.gz.sha256

      - name: Package binary (zip)
        if: matrix.pkg == 'zip'
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/${{ matrix.binary }} dist/${{ matrix.binary }}
          cd dist
          sha256sum ${{ matrix.binary }} > ${{ matrix.binary }}.sha256
          zip aegis-agent-${{ matrix.variant }}-${{ matrix.arch }}.zip ${{ matrix.binary }}
          sha256sum aegis-agent-${{ matrix.variant }}-${{ matrix.arch }}.zip > aegis-agent-${{ matrix.variant }}-${{ matrix.arch }}.zip.sha256

      - name: Verify static linking (Linux amd64)
        if: matrix.pkg == 'tar' && matrix.arch == 'amd64'
        run: |
          file dist/${{ matrix.binary }}
          ldd dist/${{ matrix.binary }} 2>&1 | grep -q "not a dynamic executable" || \
            ldd dist/${{ matrix.binary }} 2>&1 | grep -q "statically linked" || \
            echo "WARNING: Binary may not be fully static"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.variant }}-${{ matrix.arch }}
          path: dist/

  docker:
    name: Docker Image
    runs-on: ubuntu-latest
    needs: build-binaries
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine target registries
        id: registries
        run: |
          enabled="${{ secrets.DOCKERHUB_USERNAME != '' && secrets.DOCKERHUB_TOKEN != '' }}"
          echo "dockerhub_enabled=$enabled" >> "$GITHUB_OUTPUT"
          images="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"
          if [ "$enabled" = "true" ]; then
            images="${images}
          docker.io/enzotrevisan9/dodo-agent"
          fi
          {
            echo "images<<REGISTRIES_EOF"
            echo "$images"
            echo "REGISTRIES_EOF"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v3
        if: steps.registries.outputs.dockerhub_enabled == 'true'
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ steps.registries.outputs.images }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      - uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  verify-public-image:
    name: Verify anonymous image pull
    runs-on: ubuntu-latest
    needs: docker
    steps:
      - name: Pull the published version without credentials
        run: |
          version="${GITHUB_REF_NAME#v}"
          export DOCKER_CONFIG="$(mktemp -d)"
          docker pull "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${version}"

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [build-binaries, docker, verify-public-image]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Collect release assets
        run: |
          mkdir -p release
          for dir in artifacts/*/; do
            cp "${dir}"*.tar.gz release/ 2>/dev/null || true
            cp "${dir}"*.zip release/ 2>/dev/null || true
            cp "${dir}"*.sha256 release/ 2>/dev/null || true
          done
          cat release/*.sha256 > release/checksums.sha256

      - name: Copy install script
        run: |
          cp get.sh release/get.sh
          cp get.sh release/install.sh
          cmp get.sh scripts/install.sh
          (cd release && sha256sum get.sh > get.sh.sha256 && sha256sum install.sh > install.sh.sha256)
          cat release/get.sh.sha256 release/install.sh.sha256 >> release/checksums.sha256

      - uses: softprops/action-gh-release@v2
        with:
          files: release/*
          body: |
            ## Platform Support

            | Platform | Arch | Variant | File |
            |----------|------|---------|------|
            | Linux    | amd64 | Standard | `aegis-agent-linux-amd64.tar.gz` |
            | Linux    | arm64 | Standard | `aegis-agent-linux-arm64.tar.gz` |
            | Linux    | amd64 | Lite (IoT/Edge) | `aegis-agent-lite-amd64.tar.gz` |
            | Linux    | arm64 | Lite (IoT/Edge) | `aegis-agent-lite-arm64.tar.gz` |
            | Windows  | amd64 | Standard | `aegis-agent-windows-amd64.zip` |

            ## Quick Install

            **Linux:**
            ```bash
            curl -fsSL https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/get.sh -o get.sh
            # Set DODO_API_KEY and the environment endpoints from the installation manifest.
            sudo -E bash get.sh --version ${{ github.ref_name }} --endpoint "$DODO_ENDPOINT" --enrollment-endpoint "$DODO_ENROLLMENT_ENDPOINT"
            ```

            **Docker:**
            ```bash
            docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.ref_name }}
            docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }}

            docker pull docker.io/enzotrevisan9/dodo-agent:${{ github.ref_name }}
            docker pull docker.io/enzotrevisan9/dodo-agent:${{ steps.version.outputs.version }}
            ```

            **Verify integrity:**
            ```bash
            sha256sum -c checksums.sha256
            ```

            ## What's Changed
            See [CHANGELOG.md](${{ github.server_url }}/${{ github.repository }}/blob/${{ github.ref_name }}/CHANGELOG.md)
