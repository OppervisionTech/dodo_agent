[package]
name = "agent-collectors"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[features]
default = []
ebpf = ["dep:agent-ebpf"]
otel = ["dep:axum", "dep:prost-types", "dep:hyper", "dep:hyper-util", "dep:http-body-util"]
docker = []
postgres = ["dep:tokio-postgres"]
mongodb = ["dep:mongodb"]
redis-collector = []

[dependencies]
agent-core = { workspace = true }
agent-transport = { workspace = true }
agent-platform = { workspace = true }
agent-ebpf = { workspace = true, optional = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
tonic = { workspace = true }
prost = { workspace = true }
prost-types = { workspace = true, optional = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
sha2 = { workspace = true }
uuid = { workspace = true }
regex = { workspace = true }
reqwest = { workspace = true }
glob = { workspace = true }
x509-parser = { workspace = true }

# OTEL HTTP listener
axum = { workspace = true, optional = true }

# OTEL gRPC listener (hyper-based)
hyper = { version = "1", features = ["server", "http2"], optional = true }
hyper-util = { version = "0.1", features = ["tokio", "http2", "server-auto", "server"], optional = true }
http-body-util = { version = "0.1", optional = true }

# Database clients (optional, feature-gated)
tokio-postgres = { workspace = true, optional = true }
mongodb = { workspace = true, optional = true }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
